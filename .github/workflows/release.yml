name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name (for example v0.1.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build release executable
        run: cargo build --release --workspace

      - name: Package release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\key2pc.exe dist\key2pc.exe
          Compress-Archive -Path target\release\key2pc.exe, config.json, README.md, LICENSE -DestinationPath dist\key2pc-windows-x86_64.zip -Force

      - name: Determine release tag
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            if ("${{ github.ref_type }}" -eq "tag") {
              $tag = "${{ github.ref_name }}"
            } else {
              $versionLine = Select-String -Path crates\key2pc\Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
              $ver = $versionLine.Matches[0].Groups[1].Value
              $tag = "v$ver"
            }
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "${{ steps.meta.outputs.tag }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist\key2pc.exe dist\key2pc-windows-x86_64.zip --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release create $tag dist\key2pc.exe dist\key2pc-windows-x86_64.zip --title "Key2PC $tag" --target "${{ github.sha }}" --generate-notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
